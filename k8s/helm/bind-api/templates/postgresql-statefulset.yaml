{{- if and .Values.postgresql.enabled (eq .Values.role "master") }}
{{- $persistence := .Values.postgresql.primary.persistence }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bind-api.fullname" . }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "bind-api.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "bind-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "bind-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: postgres:15-alpine
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | default "bind_api" | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgresql.primary.resources | nindent 12 }}
          # -d обязателен: без него libpq подставляет dbname = user ("bindapi")
          # и каждая проба пишет в лог FATAL: database "bindapi" does not exist
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username }}
                - -d
                - {{ .Values.postgresql.auth.database | default "bind_api" }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username }}
                - -d
                - {{ .Values.postgresql.auth.database | default "bind_api" }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      {{- if not $persistence.enabled }}
      volumes:
        - name: postgres-data
          emptyDir: {}
      {{- end }}
  {{- if $persistence.enabled }}
  # Том создаётся контроллером StatefulSet (postgres-data-<sts>-0).
  # НЕ дублируйте этот том в pod.spec.volumes — контроллер всё равно его перезапишет.
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $persistence.size }}
        {{- if $persistence.storageClass }}
        storageClassName: {{ $persistence.storageClass }}
        {{- end }}
  {{- end }}
{{- end }}