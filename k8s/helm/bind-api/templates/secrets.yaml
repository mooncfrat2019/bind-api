{{- /* Параметры БД считаем один раз — чтобы URL и ConfigMap не расходились */ -}}
{{- $dbUser := "" -}}
{{- $dbPassword := "" -}}
{{- $dbHost := "" -}}
{{- $dbPort := "5432" -}}
{{- $dbName := "bind_api" -}}
{{- $dbSSLMode := "disable" -}}
{{- if .Values.postgresql.enabled -}}
{{- $dbUser = .Values.postgresql.auth.username -}}
{{- $dbPassword = .Values.postgresql.auth.password -}}
{{- $dbHost = printf "%s-postgresql" .Release.Name -}}
{{- $dbName = .Values.postgresql.auth.database | default "bind_api" -}}
{{- else if .Values.externalPostgresql.enabled -}}
{{- $dbUser = .Values.externalPostgresql.user -}}
{{- $dbPassword = .Values.externalPostgresql.password -}}
{{- $dbHost = .Values.externalPostgresql.host -}}
{{- $dbPort = .Values.externalPostgresql.port | default "5432" -}}
{{- $dbName = .Values.externalPostgresql.database | default "bind_api" -}}
{{- $dbSSLMode = .Values.externalPostgresql.sslMode | default "disable" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bind-api.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $dbUser }}
  {{- if .Values.postgresql.enabled }}
  # Оставлено для внешних инструментов: сам Postgres в этом чарте читает values напрямую
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}
  BIND_API_DB_PASSWORD: {{ $dbPassword | quote }}
  # ЕДИНСТВЕННЫЙ источник имени БД для приложения (перекрывает envFrom из ConfigMap)
  BIND_API_DB_URL: {{ printf "postgres://%s:%s@%s:%s/%s?sslmode=%s"
    $dbUser
    ($dbPassword | urlquery | replace "+" "%20")
    $dbHost
    $dbPort
    $dbName
    $dbSSLMode | quote }}
  {{- end }}

  BIND_API_BOOTSTRAP_KEY: {{ .Values.secrets.bootstrapKey | quote }}
  SYNC_API_TOKEN: {{ .Values.secrets.syncToken | quote }}
  MASTER_API_TOKEN: {{ .Values.secrets.masterApiToken | quote }}
  RNDC_KEY_SECRET: {{ .Values.secrets.rndcKeySecret | quote }}

  {{- if and .Values.master .Values.master.url }}
  MASTER_URL: {{ .Values.master.url | quote }}
  {{- else }}
  MASTER_URL: {{ include "bind-api.masterUrl" . | quote }}
  {{- end }}