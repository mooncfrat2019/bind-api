apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bind-api.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  # Встроенный PostgreSQL
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  BIND_API_DB_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  BIND_API_DB_URL: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=disable"
    .Values.postgresql.auth.username
    .Values.postgresql.auth.password
    .Release.Name
    .Values.postgresql.auth.database | quote }}
  {{- else if .Values.externalPostgresql.enabled }}
  # Внешний PostgreSQL
  {{- if .Values.externalPostgresql.existingSecret }}
  # Использовать существующий secret
  BIND_API_DB_PASSWORD: {{ printf "{{ .Values.externalPostgresql.password }}" | quote }}
  BIND_API_DB_URL: {{ printf "postgres://%s:{{ .Values.externalPostgresql.password }}@%s:%s/%s?sslmode=%s"
    .Values.externalPostgresql.user
    .Values.externalPostgresql.host
    .Values.externalPostgresql.port
    .Values.externalPostgresql.database
    .Values.externalPostgresql.sslMode | quote }}
  {{- else }}
  BIND_API_DB_PASSWORD: {{ .Values.externalPostgresql.password | quote }}
  BIND_API_DB_URL: {{ printf "postgres://%s:%s@%s:%s/%s?sslmode=%s"
    .Values.externalPostgresql.user
    .Values.externalPostgresql.password
    .Values.externalPostgresql.host
    .Values.externalPostgresql.port
    .Values.externalPostgresql.database
    .Values.externalPostgresql.sslMode | quote }}
  {{- end }}
  {{- end }}

  BIND_API_BOOTSTRAP_KEY: {{ .Values.secrets.bootstrapKey | quote }}
  SYNC_API_TOKEN: {{ .Values.secrets.syncToken | quote }}
  MASTER_API_TOKEN: {{ .Values.secrets.masterApiToken | quote }}
  RNDC_KEY_SECRET: {{ .Values.secrets.rndcKeySecret | quote }}

  {{- if .Values.master }}
  {{- if .Values.master.url }}
  MASTER_URL: {{ .Values.master.url | quote }}
  {{- else }}
  MASTER_URL: {{ include "bind-api.masterUrl" . | quote }}
  {{- end }}
  {{- else }}
  MASTER_URL: {{ include "bind-api.masterUrl" . | quote }}
  {{- end }}