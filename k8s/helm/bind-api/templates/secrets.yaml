apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bind-api.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  BIND_API_DB_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  BIND_API_DB_URL: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=disable"
    .Values.postgresql.auth.username
    .Values.postgresql.auth.password
    .Release.Name
    .Values.postgresql.auth.database | quote }}
  {{- end }}

  BIND_API_BOOTSTRAP_KEY: {{ .Values.secrets.bootstrapKey | quote }}
  SYNC_API_TOKEN: {{ .Values.secrets.syncToken | quote }}
  MASTER_API_TOKEN: {{ .Values.secrets.masterApiToken | quote }}
  RNDC_KEY_SECRET: {{ .Values.secrets.rndcKeySecret | quote }}

  {{- if .Values.master.url }}
  MASTER_URL: {{ .Values.master.url | quote }}
  {{- else }}
  MASTER_URL: {{ include "bind-api.masterUrl" . | quote }}
  {{- end }}