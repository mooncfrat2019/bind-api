{{- /*
Параметры БД считаем РОВНО ОДИН РАЗ, чтобы ConfigMap, Secret и DSN
не могли разойтись между собой.

Поддерживаемые режимы:
  1. postgresql.enabled = true
       → встроенный PostgreSQL
  2. externalPostgresql.enabled = true, пароль задан в values
       → внешний PostgreSQL, пароль хранится в этом Secret
  3. externalPostgresql.enabled = true, задан externalPostgresql.existingSecret
       → внешний PostgreSQL, пароль берётся из существующего Secret,
         DB-ключи в этом Secret НЕ рендерятся (см. master-statefulset.yaml)
*/ -}}

{{- $dbUser := "" -}}
{{- $dbPassword := "" -}}
{{- $dbHost := "" -}}
{{- $dbPort := "5432" -}}
{{- $dbName := "bind_api" -}}
{{- $dbSSLMode := "disable" -}}
{{- $useExistingSecret := false -}}

{{- if .Values.postgresql.enabled -}}
  {{- $dbUser = .Values.postgresql.auth.username -}}
  {{- $dbPassword = .Values.postgresql.auth.password -}}
  {{- $dbHost = printf "%s-postgresql" .Release.Name -}}
  {{- $dbName = .Values.postgresql.auth.database | default "bind_api" -}}
{{- else if .Values.externalPostgresql.enabled -}}
  {{- $dbUser = .Values.externalPostgresql.user -}}
  {{- $dbHost = .Values.externalPostgresql.host -}}
  {{- $dbPort = .Values.externalPostgresql.port | default "5432" -}}
  {{- $dbName = .Values.externalPostgresql.database | default "bind_api" -}}
  {{- $dbSSLMode = .Values.externalPostgresql.sslMode | default "disable" -}}
  {{- if .Values.externalPostgresql.existingSecret -}}
    {{- $useExistingSecret = true -}}
  {{- else -}}
    {{- $dbPassword = .Values.externalPostgresql.password -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bind-api.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  # Дублируется для внешних инструментов (сам Postgres в чарте читает values напрямую)
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}

  {{- if $dbUser }}
  {{- if $useExistingSecret }}
  # ───────────────────────────────────────────────────────────────────────────
  # externalPostgresql.existingSecret задан: пароль и (опционально) DSN
  # берутся напрямую из {{ .Values.externalPostgresql.existingSecret }} в поде.
  # Здесь DB-ключи НЕ создаются намеренно — чтобы не хранить пароль дважды.
  #
  # Остальные параметры подключения приложение получает из ConfigMap:
  #   BIND_API_DB_HOST / BIND_API_DB_PORT / BIND_API_DB_USER / BIND_API_DB_NAME
  # плюс BIND_API_DB_PASSWORD из существующего Secret (см. master-statefulset.yaml).
  #
  # Если приложению нужен именно полный DSN, положите его в существующий Secret
  # и укажите ключ через externalPostgresql.existingSecretUrlKey.
  # ───────────────────────────────────────────────────────────────────────────
  {{- else }}
  BIND_API_DB_PASSWORD: {{ $dbPassword | quote }}
  # urlquery обязателен: пароль может содержать : / @ # ? и сломать DSN.
  # "+" заменяем на "%20" — urlquery кодирует пробел именно как "+",
  # а в userinfo DSN это недопустимо.
  BIND_API_DB_URL: {{ printf "postgres://%s:%s@%s:%s/%s?sslmode=%s"
    $dbUser
    ($dbPassword | urlquery | replace "+" "%20")
    $dbHost
    $dbPort
    $dbName
    $dbSSLMode | quote }}
  {{- end }}
  {{- end }}

  BIND_API_BOOTSTRAP_KEY: {{ .Values.secrets.bootstrapKey | quote }}
  SYNC_API_TOKEN: {{ .Values.secrets.syncToken | quote }}
  MASTER_API_TOKEN: {{ .Values.secrets.masterApiToken | quote }}
  RNDC_KEY_SECRET: {{ .Values.secrets.rndcKeySecret | quote }}

  {{- if and .Values.master .Values.master.url }}
  MASTER_URL: {{ .Values.master.url | quote }}
  {{- else }}
  MASTER_URL: {{ include "bind-api.masterUrl" . | quote }}
  {{- end }}