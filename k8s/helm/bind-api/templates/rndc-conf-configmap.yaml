apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bind-api.fullname" . }}-rndc-conf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
data:
  rndc.conf: |
    key "rndc-key" {
        algorithm hmac-sha256;
        secret "{{ .Values.secrets.rndcKeySecret }}";
    };

    options {
        default-key "rndc-key";
        default-server 127.0.0.1;
        default-port 953;
    };