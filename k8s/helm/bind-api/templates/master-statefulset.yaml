{{- if eq .Values.role "master" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bind-api.fullname" . }}-master
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: master
spec:
  serviceName: {{ include "bind-api.fullname" . }}-master
  replicas: {{ .Values.replicaCount.master }}
  selector:
    matchLabels:
      {{- include "bind-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        {{- include "bind-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: master
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ include "bind-api.apiPort" . }}"
        prometheus.io/path: "/metrics"
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "bind-api.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        - name: init-config
          image: "{{ .Values.bind.image.repository }}:{{ .Values.bind.image.tag }}"
          imagePullPolicy: {{ .Values.bind.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              # Копируем конфиги из read-only volume в writable
              cp /config/named.conf /etc/named.conf
              cp /config/named.zones.conf /etc/named.zones.conf
              chown root:named /etc/named.conf /etc/named.zones.conf
              chmod 640 /etc/named.conf /etc/named.zones.conf
              # Инициализируем директорию зон
              mkdir -p /var/named
              chown -R root:named /var/named
              chmod 775 /var/named
              echo "Config initialized"
          volumeMounts:
            - name: config-src
              mountPath: /config
            - name: etc-config
              mountPath: /etc
            - name: bind-zones-storage
              mountPath: /var/named
            - name: etc-config
              mountPath: /etc/named.conf
              subPath: named.conf
            - name: etc-config
              mountPath: /etc/named.zones.conf
              subPath: named.zones.conf
            - name: rndc-key
              mountPath: /etc/rndc.key
              subPath: rndc.key
            - name: rndc-conf
              mountPath: /etc/rndc.conf
              subPath: rndc.conf
            - name: run-named
              mountPath: /run/named
          securityContext:
            runAsUser: 0
      containers:
        - name: bind9
          image: "{{ .Values.bind.image.repository }}:{{ .Values.bind.image.tag }}"
          imagePullPolicy: {{ .Values.bind.image.pullPolicy }}
          command:
            - /usr/sbin/named
            - -g
            - -c
            - /etc/named.conf
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: rndc
              containerPort: 953
              protocol: TCP
          volumeMounts:
            - name: bind-zones-storage
              mountPath: /var/named
            - name: etc-config
              mountPath: /etc/named.conf
              subPath: named.conf
            - name: etc-config
              mountPath: /etc/named.zones.conf
              subPath: named.zones.conf
            - name: rndc-key
              mountPath: /etc/rndc.key
              subPath: rndc.key
            - name: run-named
              mountPath: /run/named
          resources:
            {{- toYaml .Values.bind.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_BIND_SERVICE
        - name: bind-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ include "bind-api.apiPort" . }}
              protocol: TCP
          env:
            - name: APP_ROLE
              value: "master"
            - name: BIND_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: BIND_API_DB_PASSWORD
            - name: BIND_API_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: BIND_API_DB_URL
            - name: BIND_API_BOOTSTRAP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: BIND_API_BOOTSTRAP_KEY
            - name: SYNC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: SYNC_API_TOKEN
          envFrom:
            - configMapRef:
                name: {{ include "bind-api.fullname" . }}-config
          volumeMounts:
            - name: bind-zones-storage
              mountPath: /var/named
            - name: etc-config
              mountPath: /etc/named.conf
              subPath: named.conf
            - name: etc-config
              mountPath: /etc/named.zones.conf
              subPath: named.zones.conf
            - name: rndc-key
              mountPath: /etc/rndc.key
              subPath: rndc.key
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config-src
          configMap:
            name: {{ include "bind-api.fullname" . }}-config
            items:
              - key: named.conf
                path: named.conf
              - key: named.zones.conf
                path: named.zones.conf
        - name: etc-config
          emptyDir: { }
        - name: rndc-key
          secret:
            secretName: {{ include "bind-api.fullname" . }}-secrets
            items:
              - key: RNDC_KEY_SECRET
                path: rndc.key
                mode: 0640
        - name: rndc-conf
          configMap:
            name: {{ include "bind-api.fullname" . }}-rndc-conf
            defaultMode: 0640
        - name: run-named
          emptyDir: { }
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.zonesStorage.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: bind-zones-storage
      spec:
        accessModes:
          {{- toYaml .Values.zonesStorage.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.zonesStorage.size }}
        {{- $storageClass := include "bind-api.storageClass" . }}
        {{- if $storageClass }}
        storageClassName: {{ $storageClass }}
        {{- end }}
  {{- end }}
{{- end }}