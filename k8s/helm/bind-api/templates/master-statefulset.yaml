{{- if gt (int .Values.replicaCount.master) 0 }}
{{- $useExistingSecret := and .Values.externalPostgresql.enabled (not (empty .Values.externalPostgresql.existingSecret)) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bind-api.fullname" . }}-master
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: master
spec:
  serviceName: {{ include "bind-api.fullname" . }}-master
  replicas: {{ .Values.replicaCount.master }}
  selector:
    matchLabels:
      {{- include "bind-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        {{- include "bind-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: master
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ include "bind-api.apiPort" . }}"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "bind-api.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        {{- if or .Values.postgresql.enabled .Values.externalPostgresql.enabled }}
        - name: wait-for-postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Waiting for PostgreSQL at ${DB_HOST}:${DB_PORT} (user=${DB_USER}, db=${DB_NAME})..."
              attempt=0
              until pg_isready -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "${attempt}" -ge 150 ]; then
                  echo "ERROR: PostgreSQL is not ready after ~5 minutes. Aborting." >&2
                  exit 1
                fi
                echo "attempt ${attempt}: PostgreSQL not ready, retrying in 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready"
          env:
            - name: DB_HOST
              value: {{ include "bind-api.postgresqlHost" . | quote }}
            {{- if .Values.postgresql.enabled }}
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.auth.database | default "bind_api" | quote }}
            {{- else }}
            - name: DB_PORT
              value: {{ .Values.externalPostgresql.port | default "5432" | quote }}
            - name: DB_USER
              value: {{ .Values.externalPostgresql.user | quote }}
            - name: DB_NAME
              value: {{ .Values.externalPostgresql.database | default "bind_api" | quote }}
            {{- end }}
          securityContext:
            runAsUser: 0
        {{- end }}
        - name: init-config
          image: "{{ .Values.bind.image.repository }}:{{ .Values.bind.image.tag }}"
          imagePullPolicy: {{ .Values.bind.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              cp /config-src/named.conf /config/named.conf
              cp /config-src/named.zones.conf /config/named.zones.conf

              RNDC_KEY=$(cat /rndc-src/rndc.key)

              cat > /config/rndc.conf << EOF
              key "rndc-key" {
                  algorithm hmac-sha256;
                  secret "${RNDC_KEY}";
              };
              options {
                  default-key "rndc-key";
                  default-server 127.0.0.1;
                  default-port 953;
              };
              EOF

              cat > /config/rndc.key << EOF
              key "rndc-key" {
                  algorithm hmac-sha256;
                  secret "${RNDC_KEY}";
              };
              EOF

              chmod 640 /config/named.conf /config/named.zones.conf /config/rndc.conf /config/rndc.key

              mkdir -p /var/named
              chmod 775 /var/named

              mkdir -p /run/named
              echo "Master config initialized"
          volumeMounts:
            - name: config-src
              mountPath: /config-src
            - name: rndc-src
              mountPath: /rndc-src
            - name: config
              mountPath: /config
            - name: bind-zones-storage
              mountPath: /var/named
            - name: run-named
              mountPath: /run/named
          securityContext:
            runAsUser: 0
      containers:
        - name: bind9
          image: "{{ .Values.bind.image.repository }}:{{ .Values.bind.image.tag }}"
          imagePullPolicy: {{ .Values.bind.image.pullPolicy }}
          command:
            - /usr/sbin/named
            - -g
            - -c
            - /config/named.conf
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: rndc
              containerPort: 953
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: bind-zones-storage
              mountPath: /var/named
            - name: run-named
              mountPath: /run/named
          resources:
            {{- toYaml .Values.bind.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_BIND_SERVICE
        - name: bind-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ include "bind-api.apiPort" . }}
              protocol: TCP
          env:
            - name: RNDC_CONF
              value: "/config/rndc.conf"
            - name: APP_ROLE
              value: "master"
            {{- if $useExistingSecret }}
            - name: BIND_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalPostgresql.existingSecret }}
                  key: {{ .Values.externalPostgresql.existingSecretPasswordKey | default "password" }}
            {{- with .Values.externalPostgresql.existingSecretUrlKey }}
            - name: BIND_API_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalPostgresql.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- else }}
            - name: BIND_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: BIND_API_DB_PASSWORD
            - name: BIND_API_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: BIND_API_DB_URL
            {{- end }}
            - name: BIND_API_BOOTSTRAP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: BIND_API_BOOTSTRAP_KEY
            - name: SYNC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: SYNC_API_TOKEN
          envFrom:
            - configMapRef:
                name: {{ include "bind-api.fullname" . }}-config
          volumeMounts:
            - name: config
              mountPath: /config
            - name: bind-zones-storage
              mountPath: /var/named
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config-src
          configMap:
            name: {{ include "bind-api.fullname" . }}-config
            items:
              - key: named.conf
                path: named.conf
              - key: named.zones.conf
                path: named.zones.conf
        - name: rndc-src
          secret:
            secretName: {{ include "bind-api.fullname" . }}-secrets
            items:
              - key: RNDC_KEY_SECRET
                path: rndc.key
        - name: config
          emptyDir: { }
        - name: run-named
          emptyDir: { }
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.zonesStorage.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: bind-zones-storage
      spec:
        accessModes:
          {{- toYaml .Values.zonesStorage.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.zonesStorage.size }}
        {{- $storageClass := include "bind-api.storageClass" . }}
        {{- if $storageClass }}
        storageClassName: {{ $storageClass }}
        {{- end }}
  {{- end }}
{{- end }}