{{- if and .Values.postgresql.enabled (gt (int .Values.replicaCount.master) 0) }}
---
# Headless-сервис (serviceName для StatefulSet). Именно на это имя смотрит приложение.
# publishNotReadyAddresses=true — DNS-имя резолвится сразу после старта пода,
# не дожидаясь readinessProbe.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bind-api.fullname" . }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "bind-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
---
# ClusterIP service для доступа
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bind-api.fullname" . }}-postgresql-hl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  selector:
    {{- include "bind-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
{{- end }}