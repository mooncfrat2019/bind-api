{{- if gt (int .Values.replicaCount.master) 0 }}
# Селектит ТОЛЬКО мастер: этот сервис используется как MASTER_URL репликами
# и как внешняя точка входа для HTTP API. Реплики не регистрируют /api/sync/*,
# /api/write/*, /api/keys/* — добавлять их в селект нельзя.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bind-api.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.api.type | default "ClusterIP" }}
  {{- if eq .Values.service.api.type "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.service.api.externalTrafficPolicy | default "Local" }}
  {{- end }}
  {{- if eq .Values.service.api.type "NodePort" }}
  externalTrafficPolicy: {{ .Values.service.api.externalTrafficPolicy | default "Local" }}
  {{- end }}
  selector:
    {{- include "bind-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: master
  ports:
    - port: {{ .Values.service.api.port }}
      {{- if eq .Values.service.api.type "NodePort" }}
      nodePort: {{ .Values.service.api.nodePort | default 30080 }}
      {{- end }}
      targetPort: api
      name: api
{{- end }}