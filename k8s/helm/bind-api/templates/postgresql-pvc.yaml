{{- if and .Values.postgresql.enabled .Values.postgresql.primary.persistence.enabled (eq .Values.role "master") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bind-api.fullname" . }}-postgresql-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresql.primary.persistence.size }}
  {{- if .Values.postgresql.primary.persistence.storageClass }}
  storageClassName: {{ .Values.postgresql.primary.persistence.storageClass }}
  {{- end }}
{{- end }}