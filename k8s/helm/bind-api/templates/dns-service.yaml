{{- if gt (int .Values.replicaCount.master) 0 }}
---
# Внутренний DNS для клиентов внутри кластера (CoreDNS forwarding).
# Только мастер: реплики во внутренней роли не нужны.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bind-api.fullname" . }}-dns-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
    bind-api/service: dns-internal
spec:
  type: ClusterIP
  selector:
    {{- include "bind-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: master
  ports:
    - port: 53
      targetPort: dns-tcp
      name: dns-tcp
      protocol: TCP
    - port: 53
      targetPort: dns-udp
      name: dns-udp
      protocol: UDP
{{- end }}

{{- if and .Values.service.dnsLb.enabled (gt (add (int .Values.replicaCount.master) (int .Values.replicaCount.replica)) 0) }}
---
# ГЛАВНЫЙ ВНЕШНИЙ DNS: LoadBalancer на ВСЕ DNS-поды (мастер + реплики).
#
# Один внешний IP, N endpoints. Балансировкой между ними занимается
# kube-proxy (при externalTrafficPolicy: Cluster) либо сам LBaaS.
# Когда под становится NotReady — вылетает из балансировки автоматически.
#
# Селектор — общая метка bind-api/dns-server: "true", которую вешают
# и мастер, и реплики, но НЕ postgres.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bind-api.fullname" . }}-dns-lb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
    bind-api/service: dns-lb
  {{- with .Values.service.dnsLb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.dnsLb.type | default "LoadBalancer" }}
  {{- if or (eq .Values.service.dnsLb.type "LoadBalancer") (eq .Values.service.dnsLb.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.service.dnsLb.externalTrafficPolicy | default "Cluster" }}
  {{- end }}
  {{- if and (eq .Values.service.dnsLb.type "LoadBalancer") .Values.service.dnsLb.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.dnsLb.loadBalancerIP | quote }}
  {{- end }}
  selector:
    {{- include "bind-api.selectorLabels" . | nindent 4 }}
    bind-api/dns-server: "true"
  ports:
    - port: 53
      targetPort: dns-tcp
      name: dns-tcp
      protocol: TCP
    - port: 53
      targetPort: dns-udp
      name: dns-udp
      protocol: UDP
{{- end }}