{{- if eq .Values.role "replica" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bind-api.fullname" . }}-replica
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: replica
spec:
  serviceName: {{ include "bind-api.fullname" . }}-replica
  replicas: {{ .Values.replicaCount.replica }}
  selector:
    matchLabels:
      {{- include "bind-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: replica
  template:
    metadata:
      labels:
        {{- include "bind-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: replica
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ include "bind-api.apiPort" . }}"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "bind-api.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        # Инициализация прав доступа к файлам
        - name: init-permissions
          image: "{{ .Values.bind.image.repository }}:{{ .Values.bind.image.tag }}"
          imagePullPolicy: {{ .Values.bind.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /var/named
              chown -R root:named /var/named
              chmod 775 /var/named
              cp /etc/named.conf.init /etc/named.conf
              cp /etc/named.zones.conf.init /etc/named.zones.conf
              chown root:named /etc/named.conf /etc/named.zones.conf
              chmod 640 /etc/named.conf /etc/named.zones.conf
              echo "Permissions initialized"
          volumeMounts:
            - name: bind-zones-storage
              mountPath: /var/named
            - name: bind-config
              mountPath: /etc/named.conf.init
              subPath: named.conf
            - name: bind-zones-config
              mountPath: /etc/named.zones.conf.init
              subPath: named.zones.conf
            - name: etc-named
              mountPath: /etc/named.conf
            - name: etc-zones
              mountPath: /etc/named.zones.conf
          securityContext:
            runAsUser: 0
      containers:
        # === КОНТЕЙНЕР BIND 9 ===
        - name: bind9
          image: "{{ .Values.bind.image.repository }}:{{ .Values.bind.image.tag }}"
          imagePullPolicy: {{ .Values.bind.image.pullPolicy }}
          command:
            - /usr/sbin/named
            - -g
            - -c
            - /etc/named.conf
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
          volumeMounts:
            - name: bind-zones-storage
              mountPath: /var/named
            - name: etc-named
              mountPath: /etc/named.conf
              subPath: named.conf
            - name: etc-zones
              mountPath: /etc/named.zones.conf
              subPath: named.zones.conf
          resources:
            {{- toYaml .Values.bind.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "kill -0 $(cat /var/named/named.pid 2>/dev/null) 2>/dev/null"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "dig @127.0.0.1 . > /dev/null 2>&1"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_BIND_SERVICE

        # === КОНТЕЙНЕР BIND-API ===
        - name: bind-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ include "bind-api.apiPort" . }}
              protocol: TCP
          env:
            - name: APP_ROLE
              value: "replica"
            - name: MASTER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: MASTER_URL
            - name: MASTER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: MASTER_API_TOKEN
            - name: SYNC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: SYNC_API_TOKEN
          envFrom:
            - configMapRef:
                name: {{ include "bind-api.fullname" . }}-config
          volumeMounts:
            - name: bind-zones-storage
              mountPath: /var/named
            - name: etc-named
              mountPath: /etc/named.conf
              subPath: named.conf
            - name: etc-zones
              mountPath: /etc/named.zones.conf
              subPath: named.zones.conf
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: bind-config
          configMap:
            name: {{ include "bind-api.fullname" . }}-config
            items:
              - key: named.conf
                path: named.conf
        - name: bind-zones-config
          configMap:
            name: {{ include "bind-api.fullname" . }}-config
            items:
              - key: named.zones.conf
                path: named.zones.conf
        - name: etc-named
          emptyDir: {}
        - name: etc-zones
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.zonesStorage.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: bind-zones-storage
      spec:
        accessModes:
          {{- toYaml .Values.zonesStorage.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.zonesStorage.size }}
        {{- $storageClass := include "bind-api.storageClass" . }}
        {{- if $storageClass }}
        storageClassName: {{ $storageClass }}
        {{- end }}
  {{- end }}
{{- end }}