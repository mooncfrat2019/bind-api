{{- if eq .Values.role "replica" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bind-api.fullname" . }}-replica
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bind-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: replica
spec:
  serviceName: {{ include "bind-api.fullname" . }}-replica
  replicas: {{ .Values.replicaCount.replica }}
  selector:
    matchLabels:
      {{- include "bind-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: replica
  template:
    metadata:
      labels:
        {{- include "bind-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: replica
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ include "bind-api.apiPort" . }}"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "bind-api.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        # /config должен быть РЕАЛЬНЫМ writable каталогом: ReplicaSync
        # переписывает named.conf / named.zones.conf через os.Rename.
        - name: init-config
          image: "{{ .Values.bind.image.repository }}:{{ .Values.bind.image.tag }}"
          imagePullPolicy: {{ .Values.bind.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              cp /config-src/named.conf /config/named.conf
              cp /config-src/named.zones.conf /config/named.zones.conf

              RNDC_KEY=$(cat /rndc-src/rndc.key)

              cat > /config/rndc.key << EOF
              key "rndc-key" {
                  algorithm hmac-sha256;
                  secret "${RNDC_KEY}";
              };
              EOF

              cat > /config/rndc.conf << EOF
              key "rndc-key" {
                  algorithm hmac-sha256;
                  secret "${RNDC_KEY}";
              };
              options {
                  default-key "rndc-key";
                  default-server 127.0.0.1;
                  default-port 953;
              };
              EOF

              chmod 640 /config/named.conf /config/named.zones.conf /config/rndc.conf /config/rndc.key

              mkdir -p /var/named/slaves /run/named
              chmod 775 /var/named
              echo "Replica config initialized"
          volumeMounts:
            - name: config-src
              mountPath: /config-src
            - name: rndc-src
              mountPath: /rndc-src
            - name: config
              mountPath: /config
            - name: bind-zones-storage
              mountPath: /var/named
            - name: run-named
              mountPath: /run/named
          securityContext:
            runAsUser: 0
      containers:
        # === КОНТЕЙНЕР BIND 9 ===
        - name: bind9
          image: "{{ .Values.bind.image.repository }}:{{ .Values.bind.image.tag }}"
          imagePullPolicy: {{ .Values.bind.image.pullPolicy }}
          command:
            - /usr/sbin/named
            - -g
            - -c
            - /config/named.conf
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: rndc
              containerPort: 953
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: bind-zones-storage
              mountPath: /var/named
            - name: run-named
              mountPath: /run/named
          resources:
            {{- toYaml .Values.bind.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "kill -0 $(cat /var/named/named.pid 2>/dev/null) 2>/dev/null"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "dig @127.0.0.1 . > /dev/null 2>&1"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_BIND_SERVICE

        # === КОНТЕЙНЕР BIND-API ===
        - name: bind-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ include "bind-api.apiPort" . }}
              protocol: TCP
          env:
            - name: RNDC_CONF
              value: "/config/rndc.conf"
            - name: APP_ROLE
              value: "replica"
            - name: MASTER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: MASTER_URL
            # Должен совпадать с SYNC_API_TOKEN мастера
            - name: MASTER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: MASTER_API_TOKEN
            - name: SYNC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bind-api.fullname" . }}-secrets
                  key: SYNC_API_TOKEN
            - name: REPLICA_MASTER_IP
              value: {{ .Values.master.ip | default "" | quote }}
            - name: REPLICA_ZONE_TYPE
              value: "slave"
            - name: REPLICA_ZONE_SUBDIR
              value: "slaves"
            - name: REPLICA_REMOVE_ALLOW_TRANSFER
              value: "true"
            - name: REPLICA_DISABLE_IPV6
              value: "true"
          envFrom:
            - configMapRef:
                name: {{ include "bind-api.fullname" . }}-config
          volumeMounts:
            - name: config
              mountPath: /config
            - name: bind-zones-storage
              mountPath: /var/named
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config-src
          configMap:
            name: {{ include "bind-api.fullname" . }}-config
            items:
              - key: named.conf
                path: named.conf
              - key: named.zones.conf
                path: named.zones.conf
        - name: rndc-src
          secret:
            secretName: {{ include "bind-api.fullname" . }}-secrets
            items:
              - key: RNDC_KEY_SECRET
                path: rndc.key
        - name: config
          emptyDir: { }
        - name: run-named
          emptyDir: { }
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.zonesStorage.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: bind-zones-storage
      spec:
        accessModes:
          {{- toYaml .Values.zonesStorage.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.zonesStorage.size }}
        {{- $storageClass := include "bind-api.storageClass" . }}
        {{- if $storageClass }}
        storageClassName: {{ $storageClass }}
        {{- end }}
  {{- end }}
{{- end }}