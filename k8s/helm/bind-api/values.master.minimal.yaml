role: master

replicaCount:
  master: 1
  replica: 0

postgresql:
  enabled: true
  auth:
    postgresPassword: "test-superuser-password"
    username: bindapi
    password: "test-bindapi-password"
    database: bind_api
  primary:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: openebs-hostpath

zonesStorage:
  enabled: true
  size: 10Gi
  storageClass: openebs-hostpath

secrets:
  postgresPassword: "test-bindapi-password"
  bootstrapKey: "test-bootstrap-key-min-32-chars-long-secure"
  syncToken: "test-sync-token-value"
  masterApiToken: "test-master-api-token"
  rndcKeySecret: "dGVzdC1ybmRjLWtleS1iYXNlNjQtZW5jb2RlZA=="

config:
  logLevel: DEBUG
  apiPort: ":8080"
  queue:
    maxSize: 1000
    workerTimeout: 180
    batchSize: 50
    batchInterval: 5
    thresholdLow: 0.1
    thresholdHigh: 0.3
    reloadInterval: 10
  sync:
    cleanupInterval: "5m"
    interval: 30
    subnet: "10.0.0.0/8"
    allowInsecure: false

service:
  dns:
    type: LoadBalancer
    loadBalancerIP: 192.168.0.77
    externalTrafficPolicy: Local
  api:
    type: LoadBalancer
    loadBalancerIP: 192.168.0.77
    port: 8080

ingress:
  enabled: false

serviceAccount:
  create: true

rbac:
  create: true

monitoring:
  enabled: false

pdb:
  enabled: false

master:
  url: ""

bind:
  image:
    repository: ubuntu/bind9
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

securityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0

image:
  repository: zix2045/bind-api
  tag: latest
  pullPolicy: Always