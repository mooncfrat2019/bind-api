role: master

replicaCount:
  master: 1
  replica: 0

postgresql:
  enabled: true
  auth:
    postgresPassword: "test-superuser-password"
    username: bindapi
    password: "test-bindapi-password"
    database: bind_api
  primary:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: openebs-hostpath
      createPV: true  # Создать PV вручную
      hostPath: "/var/openebs/bind-postgresql"

zonesStorage:
  enabled: true
  size: 10Gi
  storageClass: openebs-hostpath
  createPV: true  # Создать PV вручную
  hostPath: "/var/openebs/bind-zones"

secrets:
  postgresPassword: "test-bindapi-password"
  bootstrapKey: "test-bootstrap-key-min-32-chars-long-secure"
  syncToken: "test-sync-token-value"
  masterApiToken: "test-master-api-token"
  rndcKeySecret: "dGVzdC1ybmRjLWtleS1iYXNlNjQtZW5jb2RlZA=="

config:
  logLevel: DEBUG
  apiPort: ":8080"

service:
  dns:
    type: ClusterIP
  api:
    type: ClusterIP
    port: 8080

ingress:
  enabled: false

serviceAccount:
  create: true

rbac:
  create: true

monitoring:
  enabled: false

pdb:
  enabled: false

master:
  url: ""

bind:
  image:
    repository: ubuntu/bind9
    tag: "9.18"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

securityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0