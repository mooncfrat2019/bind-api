apiVersion: v1
kind: PersistentVolume
metadata:
  name: bind-zones-pv
  labels:
    app: bind-dns
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: bind-zones-storage
  hostPath:
    path: /data/bind-zones
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bind-zones-pvc
  namespace: bind-dns
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: bind-zones-storage
  selector:
    matchLabels:
      app: bind-dns