apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bind-api-master
  namespace: bind-dns
spec:
  serviceName: bind-api-master
  replicas: 1
  selector:
    matchLabels:
      app: bind-api
      role: master
  template:
    metadata:
      labels:
        app: bind-api
        role: master
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: bind-api-sa
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
        - name: bind-api
          image: bind-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: api
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 953
              name: rndc
          env:
            - name: APP_ROLE
              value: "master"
            - name: BIND_API_DB_HOST
              value: "bind-postgresql.bind-dns.svc.cluster.local"
            - name: BIND_API_DB_PORT
              value: "5432"
            - name: BIND_API_DB_USER
              valueFrom:
                secretKeyRef:
                  name: bind-secrets
                  key: POSTGRES_USER
            - name: BIND_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bind-secrets
                  key: POSTGRES_PASSWORD
            - name: BIND_API_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: bind-secrets
                  key: POSTGRES_DB
            - name: BIND_API_DB_URL
              valueFrom:
                secretKeyRef:
                  name: bind-secrets
                  key: BIND_API_DB_URL
            - name: BIND_API_BOOTSTRAP_KEY
              valueFrom:
                secretKeyRef:
                  name: bind-secrets
                  key: BIND_API_BOOTSTRAP_KEY
            - name: SYNC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bind-secrets
                  key: SYNC_API_TOKEN
            - name: API_PORT
              value: ":8080"
          envFrom:
            - configMapRef:
                name: bind-config
          volumeMounts:
            - name: bind-config
              mountPath: /etc/named.conf
              subPath: named.conf
            - name: bind-zones-config
              mountPath: /etc/named.zones.conf
              subPath: named.zones.conf
            - name: bind-zones-storage
              mountPath: /var/named
            - name: rndc-key
              mountPath: /etc/rndc.key
              subPath: rndc.key
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: bind-config
          configMap:
            name: bind-config
            items:
              - key: named.conf
                path: named.conf
        - name: bind-zones-config
          configMap:
            name: bind-config
            items:
              - key: named.zones.conf
                path: named.zones.conf
        - name: bind-zones-storage
          persistentVolumeClaim:
            claimName: bind-zones-pvc
        - name: rndc-key
          secret:
            secretName: bind-secrets
            items:
              - key: RNDC_KEY_SECRET
                path: rndc.key
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bind-api-sa
  namespace: bind-dns