apiVersion: v1
kind: Secret
metadata:
  name: bind-secrets
  namespace: bind-dns
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_USER: "bindapi"
  POSTGRES_PASSWORD: "CHANGE_ME_SECURE_PASSWORD_123"
  POSTGRES_DB: "bind_api"

  # DB URL для приложения
  BIND_API_DB_URL: "postgres://bindapi:CHANGE_ME_SECURE_PASSWORD_123@bind-postgresql:5432/bind_api?sslmode=disable"

  # Bootstrap API ключ (временный)
  BIND_API_BOOTSTRAP_KEY: "bootstrap-key-change-me-immediately-32chars"

  # Токен синхронизации между мастером и репликами
  SYNC_API_TOKEN: "secure-sync-token-between-master-replica"

  # RNDC ключ
  RNDC_KEY_SECRET: "rndc-secret-key-base64-encoded-here"

  # Мастер URL для реплик
  MASTER_API_TOKEN: "replica-to-master-auth-token"