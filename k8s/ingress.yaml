
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bind-api-ingress
  namespace: bind-dns
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - bind-api.example.com
      secretName: bind-api-tls
  rules:
    - host: bind-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bind-api-internal
                port:
                  number: 8080
---
# Ingress для реплик (только для синхронизации)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bind-replica-ingress
  namespace: bind-dns
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8"
spec:
  tls:
    - hosts:
        - bind-replica.example.com
      secretName: bind-replica-tls
  rules:
    - host: bind-replica.example.com
      http:
        paths:
          - path: /api/sync
            pathType: Prefix
            backend:
              service:
                name: bind-api-internal
                port:
                  number: 8080